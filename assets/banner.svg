<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="goldstac — Li Productions">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="0.55" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#F0B90B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F0B90B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#F0B90B" opacity="0.10"/>
    </pattern>
    <clipPath id="wordmarkClip">
      <text x="168" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="3">goldstac</text>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="#0D1117"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>

    <rect x="80" y="118" width="64" height="64" rx="16" fill="url(#gold)"/>
    <rect x="80" y="118" width="64" height="64" rx="16" fill="url(#glow)" opacity="0.6">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="112" y="163" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="38" font-weight="700" fill="#0D1117" text-anchor="middle">$</text>

    <text x="168" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#gold)" letter-spacing="3">goldstac</text>
    <rect x="-320" y="98" width="280" height="88" fill="url(#shimmer)" clip-path="url(#wordmarkClip)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1600 0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="172" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#8B949E" letter-spacing="6">LI PRODUCTIONS</text>

    <g transform="translate(80,196)">
      <g>
        <animateTransform attributeName="transform" type="scale" from="0 1" to="1 1" dur="1s" begin="0.5s" fill="freeze"/>
        <rect width="220" height="3" rx="1.5" fill="url(#goldFade)"/>
      </g>
    </g>
  </g>

  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.8s" fill="freeze"/>

    <rect x="660" y="92" width="440" height="116" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="682" cy="112" r="6" fill="#FF5F56"/>
    <circle cx="702" cy="112" r="6" fill="#FFBD2E"/>
    <circle cx="722" cy="112" r="6" fill="#27C93F"/>
    <text x="880" y="117" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6E7681" text-anchor="middle">goldstac@arch: ~</text>

    <text x="690" y="152" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="17" fill="#D4AF37">$ whoami</text>
    <rect x="782" y="140" width="9" height="19" rx="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.45;1" dur="1.1s" begin="1.5s" repeatCount="indefinite"/>
    </rect>

    <text x="690" y="178" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="15" fill="#E6EDF3" opacity="0">
      linux enthusiast · open-source advocate
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.35s" fill="freeze"/>
    </text>
    <text x="690" y="202" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="15" fill="#E6EDF3" opacity="0">
      heavy ai-native developer
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.35s" fill="freeze"/>
    </text>
    <text x="690" y="226" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" font-size="15" fill="#6E7681" opacity="0">
      i use arch, btw 🐧
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.35s" fill="freeze"/>
    </text>
  </g>

  <text x="590" y="86" font-size="20" fill="#FFD700" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="2s" repeatCount="indefinite"/></text>
  <text x="630" y="242" font-size="16" fill="#E8A33D" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="3s" repeatCount="indefinite"/></text>
  <text x="548" y="168" font-size="14" fill="#B8860B" opacity="0">✦<animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="2.6s" repeatCount="indefinite"/></text>
</svg>